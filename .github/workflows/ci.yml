name: CI

on:
  push:
  pull_request:

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # Latest 22, 24 and 26, plus the exact minimum versions from package.json "engines"
        # (^22.22.2 || ^24.15.0 || >=26.0.0), so the oldest supported releases are really tested.
        node: ['22.22.2', '22.x', '24.15.0', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dependency-audit:
    name: dependency audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      # Fails on any high or critical advisory in what the app ships (devDependencies excluded).
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: secret-scan (gitleaks, full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.24.3
      # sha256 of gitleaks_8.24.3_linux_x64.tar.gz from the release's checksums.txt
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the full git history
        # Every commit is scanned, not only the pushed range, so a root commit or a force-push
        # cannot make the scan skip anything. Allowlist for fake test values: .gitleaks.toml.
        run: '"$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --verbose --exit-code 1'
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Project secret scan (tracked files and forbidden file types)
        run: node scripts/secret-scan.mjs
